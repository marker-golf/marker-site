name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so the usage counts on the home page stay current.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Last good response from the hub stats endpoint. src/_data/stats.js
      # rewrites the file on every successful fetch and reads it when the fetch
      # fails. The key is unique per run so each run saves a fresh copy; restore
      # picks the most recent one.
      - name: Restore last good usage stats
        uses: actions/cache@v4
        with:
          path: .cache/public-stats.json
          key: public-stats-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            public-stats-

      - name: Build Eleventy site
        run: npm run build
        env:
          PATHPREFIX: /marker-site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
